<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SJ-LAB 로그인</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 360px;
    margin: 20px;
    padding: 2.5rem 2rem;
    border-radius: 1.5rem;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(30px);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
  }
  h1 {
    margin: 0 0 0.35rem;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  p.sub {
    margin: 0 0 1.75rem;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.6);
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.75);
    margin: 0 0 0.35rem;
  }
  input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    margin-bottom: 1.1rem;
    border-radius: 0.6rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 0.95rem;
  }
  input::placeholder { color: rgba(255, 255, 255, 0.35); }
  input:focus {
    outline: none;
    border-color: #60a5fa;
    background: rgba(255, 255, 255, 0.12);
  }
  button {
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: 0.6rem;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .demo {
    margin-top: 1.25rem;
    padding-top: 1.1rem;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  button.demo-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-weight: 500;
  }
  button.demo-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.16); }
  .demo-info {
    margin: 0.55rem 0 0;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.5);
    text-align: center;
  }
  .demo-info code {
    font-family: Consolas, "D2Coding", monospace;
    color: rgba(255, 255, 255, 0.8);
  }
  .error {
    min-height: 1.1rem;
    margin: -0.5rem 0 1rem;
    font-size: 0.82rem;
    color: #fca5a5;
  }
  .hint {
    margin-top: 1.25rem;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.4);
    text-align: center;
  }
  .loading {
    text-align: center;
    padding: 2rem 0;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.9rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <h1>SJ-LAB</h1>
    <p class="sub">QFieldCloud 계정으로 로그인합니다</p>

    <div id="loading" class="loading">로그인 상태 확인 중...</div>

    <form id="loginForm" hidden>
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <div id="error" class="error"></div>
      <button id="submitBtn" type="submit">로그인</button>

      <!-- 포트폴리오 방문자용 체험 계정. QFieldCloud에서 프로젝트 권한 없는 일반 계정으로만 운영할 것 -->
      <div class="demo">
        <button id="demoBtn" class="demo-btn" type="button">체험용 계정으로 로그인</button>
        <p class="demo-info">아이디 <code>demo</code> · 비밀번호 <code>sjlab-demo-2026</code></p>
      </div>
    </form>

    <p class="hint" id="redirectHint"></p>
  </div>

<script>
(function () {
  "use strict";

  // 이 페이지로 돌아올 수 있는 sj-lab 사이트만 허용한다(오픈 리다이렉트로 토큰이 새는 것 방지).
  var ALLOWED_REDIRECT_ORIGINS = [
    "http://localhost:3000",
    "http://localhost:4000",
    "https://sj-lab.co.kr",
    "https://www.sj-lab.co.kr"
  ];

  var params = new URLSearchParams(window.location.search);
  var redirectUri = params.get("redirect_uri") || "";

  function isAllowedRedirect(uri) {
    if (!uri) return false;
    try {
      var origin = new URL(uri, window.location.href).origin;
      return ALLOWED_REDIRECT_ORIGINS.indexOf(origin) !== -1;
    } catch (e) {
      return false;
    }
  }

  var redirectOk = isAllowedRedirect(redirectUri);

  var loadingEl = document.getElementById("loading");
  var formEl = document.getElementById("loginForm");
  var errorEl = document.getElementById("error");
  var submitBtn = document.getElementById("submitBtn");
  var hintEl = document.getElementById("redirectHint");

  function showForm(message) {
    loadingEl.hidden = true;
    formEl.hidden = false;
    if (message) errorEl.textContent = message;
    if (!redirectOk) {
      hintEl.textContent = "알 수 없는 요청입니다 — 로그인 후에도 자동으로 돌아가지 않습니다.";
    }
  }

  function buildReturnUrl(token, expiresIn, username) {
    var url = new URL(redirectUri);
    var fragment = "auth_token=" + encodeURIComponent(token) +
        "&auth_expires=" + encodeURIComponent(expiresIn) +
        "&auth_username=" + encodeURIComponent(username);
    url.hash = fragment;
    return url.toString();
  }

  function completeLogin(data) {
    if (redirectOk) {
      window.location.replace(buildReturnUrl(data.accessToken, data.expiresIn, data.username));
    } else {
      loadingEl.hidden = true;
      formEl.hidden = true;
      document.querySelector(".card").insertAdjacentHTML(
        "beforeend",
        '<p style="color:#86efac;font-size:0.9rem;margin-top:1rem;">' + data.username + '님, 로그인되었습니다.</p>'
      );
    }
  }

  if (params.get("logout") === "1") {
    // 각 사이트의 로그아웃 버튼은 자기 localStorage만 지울 수 있다. 여기서 세션 쿠키까지
    // 지우지 않으면 아래 세션 확인이 곧바로 새 토큰을 발급해 되돌려 보내 로그아웃이 안 된다.
    fetch("/auth/logout", { method: "POST", credentials: "include" })
      .catch(function () { /* 실패해도 폼은 보여준다 */ })
      .then(function () {
        showForm();
      });
  } else {
    // 이 오리진에 이미 유효한 세션 쿠키가 있으면 폼을 보여주지 않고 바로 돌려보낸다.
    fetch("/auth/session", { method: "GET", credentials: "include" })
      .then(function (res) {
        if (!res.ok) throw new Error("no-session");
        return res.json();
      })
      .then(completeLogin)
      .catch(function () {
        showForm();
      });
  }

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.textContent = "";
    submitBtn.disabled = true;

    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;

    fetch("/auth/login", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (res) {
        return res.json().then(function (body) { return { ok: res.ok, body: body }; });
      })
      .then(function (result) {
        if (!result.ok) {
          errorEl.textContent = result.body.message || "로그인에 실패했습니다.";
          submitBtn.disabled = false;
          return;
        }
        completeLogin(result.body);
      })
      .catch(function () {
        errorEl.textContent = "서버에 연결하지 못했습니다.";
        submitBtn.disabled = false;
      });
  });

  // 체험용 계정: 입력칸을 채운 뒤 일반 로그인과 같은 경로로 제출한다
  var DEMO_USERNAME = "demo";
  var DEMO_PASSWORD = "sjlab-demo-2026";
  document.getElementById("demoBtn").addEventListener("click", function () {
    document.getElementById("username").value = DEMO_USERNAME;
    document.getElementById("password").value = DEMO_PASSWORD;
    if (typeof formEl.requestSubmit === "function") {
      formEl.requestSubmit();
    } else {
      formEl.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
})();
</script>
</body>
</html>
