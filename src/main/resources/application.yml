server:
  port: 0
  servlet:
    context-path: /auth

spring:
  application:
    name: sj-lab-authserver

# QFieldCloud 는 sj-lab-mapservice-rest/docs 에 공개된 것과 같은 인스턴스 주소이며 비밀값이 아니다.
qfield:
  base-url: https://qfield.sj-lab.co.kr

auth:
  jwt:
    # 운영에서는 반드시 AUTH_JWT_SECRET 환경변수로 덮어쓸 것 — 이 값은 로컬 개발 전용이며
    # 저장소가 public 이라 실제 비밀값을 여기에 적지 않는다.
    secret: ${AUTH_JWT_SECRET:local-dev-only-insecure-secret-please-override-32bytes-min}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:43200}
  cookie:
    # 로그인 페이지(login.html) 자신의 오리진에만 쓰는 쿠키 — "이미 로그인했으니 폼을 또 보여줄 필요 없음"을
    # 판단하는 용도. 각 사이트(hub, mapservice)로 실제 전달되는 토큰은 URL 프래그먼트로 넘기고
    # localStorage에 저장하므로, 이 쿠키가 사이트 간에 공유될 필요는 없다.
    name: sj_session
    # http(로컬)에서는 Secure 쿠키가 저장되지 않으므로 local 프로파일에서만 false. 그 외 환경은 항상 true.
    secure: true

  # 로그인 페이지 "체험용 계정으로 로그인"(POST /auth/login/demo)이 쓰는 QFieldCloud 계정.
  # 저장소가 public 이라 값은 환경변수(운영은 k8s Secret auth-demo-credentials)로만 주입한다.
  # 비어 있으면 데모 버튼만 503, 일반 로그인은 그대로 동작한다.
  demo:
    username: ${AUTH_DEMO_USERNAME:}
    password: ${AUTH_DEMO_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
